# Limine bootloader configuration.
# Read at boot from the ISO root by the Limine bootloader.

# Skip the boot menu and launch the only entry immediately.
timeout: 0

# A boot entry. The leading '/' marks an entry; the text after it is the label.
/Hello Kernel
    # Use the Limine boot protocol (matches the requests embedded in our ELF).
    protocol: limine

    # Path to the kernel on the boot media. boot():/ is the partition Limine
    # was loaded from; we'll place kernel.elf at /boot/kernel.elf when we
    # build the ISO.
    kernel_path: boot():/boot/kernel.elf
